pair:
  asset: USDT
  fiat: UAH
update_interval: 1.0
log_file: p2p-monitor.log

exchanges:
  binance: true
  bybit: true
  okx: true
  rows: 20            # ads per side per exchange
  # Min seconds between requests to one exchange (rate-limit guard).
  # OKX returns 429 at ~1 req/s; after a 429 the exchange is skipped for 30 s.
  min_interval:
    default: 1.0
    okx: 3.0

# Banks you actually have. Each leg must support one of them.
# Empty = both ads must share a common method (old behaviour).
# Names are normalized: monobank, privatbank, pumb, a-bank, sense, raiffeisen,
# oschadbank, izibank, ukrsibbank, otp, bank transfer ...
my_payment_methods: [monobank, privatbank]

display:
  max_signals: 5   # deals shown in the terminal

arbitrage:
  min_spread_percent: 0.5
  buy_fee_percent: 0.0
  sell_fee_percent: 0.0
  min_net_profit_percent: 0.5
  max_opportunities: 10
  same_exchange: true
  cross_exchange: true
  # USDT lost moving funds between exchanges (withdrawal + network fee).
  # CHECK current withdrawal fees on the exchanges — they change.
  transfer_fee_usdt: 1.0

arbitrage_filters:
  min_finish_rate: 0.90
  min_order_count: 50
  max_pay_time_minutes: 60   # 0 = no limit

signals:
  min_score: 80
  min_net_profit_percent: 2.0
  min_volume_uah: 10000
  alert_only: false

realistic:
  safety_buffer_percent: 0.50

storage:
  enabled: true
  path: p2p.db
  snapshot_interval: 60   # seconds between best-price snapshots

alerts:
  telegram: true           # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env
  # A signal is sent once when it appears. It is sent again only if it disappeared
  # for longer than this and came back (persistent ads don't spam).
  cooldown_seconds: 600
